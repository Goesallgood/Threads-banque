<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0F141B;
    --panel:#171E27;
    --panel-2:#1C2530;
    --line:#2A3440;
    --text:#EBEDEE;
    --muted:#8B98A5;
    --brass:#C9A227;
    --brass-dim:#8A701F;
    --done:#4C8C6B;
    --done-dim:#2E4E3D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}

  .head{margin-bottom:22px;}
  .head h1{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  .head p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}

  .filters{display:flex;gap:8px;margin:20px 0 18px;flex-wrap:wrap;}
  .filters button{
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    padding:7px 13px;border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    cursor:pointer;transition:all .15s;
  }
  .filters button.active{background:var(--brass);border-color:var(--brass);color:#1a1405;font-weight:500;}

  .progress{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:22px;}
  .progress span{color:var(--brass);}

  .week{margin-top:30px;}
  .week-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;
    padding-bottom:8px;border-bottom:1px solid var(--line);
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 16px 14px;margin-bottom:12px;transition:opacity .15s,border-color .15s;
  }
  .card.done{opacity:.5;}
  .card.done .card-title{text-decoration:line-through;text-decoration-color:var(--muted);}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .card-day{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--brass);white-space:nowrap;padding-top:2px;}
  .card-title{font-size:15px;font-weight:600;line-height:1.3;}

  .media-tag{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 7px;border-radius:5px;
    white-space:nowrap;border:1px solid transparent;
  }
  .media-req{background:rgba(201,162,39,.12);color:var(--brass);border-color:rgba(201,162,39,.3);}
  .media-opt{background:rgba(139,152,165,.1);color:var(--muted);border-color:var(--line);}
  .media-none{background:transparent;color:var(--muted);border-color:var(--line);}

  .card-text{
    font-size:14px;line-height:1.6;color:#D5D9DC;white-space:pre-wrap;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:12px 13px;margin:10px 0 12px;
  }

  .card-actions{display:flex;gap:8px;align-items:center;}
  .btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;padding:7px 12px;border-radius:7px;
    border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{border-color:var(--muted);}
  .btn.copy{color:var(--brass);border-color:var(--brass-dim);}
  .btn.copy:hover{background:rgba(201,162,39,.1);}
  .btn.toggle.is-done{background:var(--done-dim);border-color:var(--done);color:#BFE3CF;}
  .btn.copy.copied{background:var(--done-dim);border-color:var(--done);color:#BFE3CF;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;}
</style>

<div class="wrap">
  <div class="head">
    <h1>Banque Threads — All'sGood Automation</h1>
    <p>@fambocredo · 4 semaines · 3 posts/semaine · Mix 70% parcours / 20% observation / 10% commercial discret. Copie le texte, poste, marque comme publié.</p>
  </div>

  <div class="progress" id="progress"></div>

  <div class="filters">
    <button data-f="all" class="active">Toutes</button>
    <button data-f="todo">À publier</button>
    <button data-f="done">Publiées</button>
  </div>

  <div id="weeks"></div>
  <div class="empty" id="empty" style="display:none;">Rien ici pour ce filtre.</div>
</div>

<script>
const POSTS = [
  {id:'s1-lun', week:'Semaine 1', day:'Lundi', title:"Le déclic", media:'none',
   text:"J'ai commencé à apprendre n8n il y a quelques mois.\nPas par curiosité tech. Par frustration.\nJuriste de formation, je voyais les mêmes tâches répétitives bouffer le temps des cabinets et des PME que j'accompagnais — relances, veille, rédaction d'actes types.\nL'IA + l'automatisation, c'était la seule réponse qui avait du sens pour moi.\nAlors j'ai appris. Pas à moitié.\nJe construis All'sGood Automation depuis. Je vais partager le parcours ici, brut, sans filtre.",
   preposted:true},

  {id:'s1-mer', week:'Semaine 1', day:'Mercredi', title:"Premier workflow qui a fonctionné", media:'req',
   text:"Mon tout premier workflow n8n qui a vraiment tourné.\nRien de spectaculaire — un formulaire de contact envoie automatiquement les bonnes infos au bon endroit, sans que personne n'ait à copier-coller un email.\nCe qui m'a marqué, ce n'est pas la technique. C'est le moment où j'ai compris que ça marchait vraiment. Pas en théorie. En vrai, sur un cas réel.\nÀ partir de là, j'ai arrêté de \"tester\" et j'ai commencé à construire."},

  {id:'s1-ven', week:'Semaine 1', day:'Vendredi', title:"Une galère réelle", media:'opt',
   text:"Un truc que personne ne dit assez sur l'automatisation : les vrais blocages ne sont presque jamais là où on les attend.\nJ'ai perdu deux jours sur un nœud qui refusait de passer une information au suivant. Pas un bug compliqué. Juste un format de donnée que je pensais évident et qui ne l'était pas.\nCe que j'en retiens : la partie \"logique métier\" est souvent plus simple que la partie \"faire parler deux outils qui n'ont pas été pensés pour se comprendre\"."},

  {id:'s2-lun', week:'Semaine 2', day:'Lundi', title:"Un angle mort côté PME africaines", media:'none',
   text:"Personne ne parle beaucoup d'automatisation pour les cabinets et PME en Afrique francophone.\nPourtant c'est souvent là que le gain est le plus évident : la même question revient 20 fois par jour sur WhatsApp, le même document se retape à la main chaque semaine, la même relance se rédige manuellement à chaque impayé.\nCe n'est pas un manque d'outils. C'est un manque de temps pour s'arrêter et regarder ce qui se répète."},

  {id:'s2-mer', week:'Semaine 2', day:'Mercredi', title:"Un workflow client concret", media:'req',
   text:"Un client me disait perdre plusieurs heures par semaine à relancer les mêmes clients avec les mêmes lettres types, à la main.\nOn a construit ça : une base de dossiers en retard → génération automatique de la lettre de relance adaptée → envoi prêt à valider.\nRésultat : ce qui prenait une matinée tient maintenant en quelques clics de validation.\n(Anonymisé, comme toujours — je ne nomme jamais un client sans son accord.)"},

  {id:'s2-ven', week:'Semaine 2', day:'Vendredi', title:"Bilan de la semaine (à personnaliser)", media:'opt',
   text:"[À compléter selon ce que tu explores vraiment cette semaine-là]\nCette semaine j'ai exploré [sujet — ex: un nouveau module n8n, un concept d'agent IA].\nCe qui m'a marqué : [ton insight].\nLa suite : [ce que tu vas creuser]."},

  {id:'s3-lun', week:'Semaine 3', day:'Lundi', title:"Deuxième workflow client", media:'req',
   text:"Un juriste freelance passait un temps fou à repartir de zéro à chaque fois qu'il devait rédiger des statuts ou un pacte d'associés.\nOn a construit un système qui génère une première version différenciée selon le type d'acte, à partir d'un brief simple.\nCe n'est pas magique — la relecture juridique reste indispensable. Mais la première version, celle qui prend le plus de temps, est déjà là."},

  {id:'s3-mer', week:'Semaine 3', day:'Mercredi', title:"Une leçon apprise à mes dépens", media:'opt',
   text:"J'ai livré une première version d'un document généré automatiquement qui perdait sa mise en forme à chaque envoi. Paragraphes collés, structure cassée.\nLa cause : un mauvais format d'export, pas la logique du workflow.\nLa leçon : dans l'automatisation appliquée au juridique, la mise en forme n'est pas un détail cosmétique. Un document mal présenté, même juste techniquement correct, n'inspire pas confiance."},

  {id:'s3-ven', week:'Semaine 3', day:'Vendredi', title:"Le projet en cours : veille OHADA", media:'none',
   text:"En ce moment je construis un système de veille juridique OHADA : Journal Officiel, jurisprudence CCJA, actualité des Actes Uniformes — résumé automatiquement et envoyé directement par WhatsApp.\nL'idée de départ : un juriste ne devrait pas avoir à aller chercher l'information tous les matins. L'information devrait venir à lui.\nEncore en finalisation. Je montrerai le résultat dès que c'est stable."},

  {id:'s4-lun', week:'Semaine 4', day:'Lundi', title:"Mon positionnement, expliqué simplement", media:'none',
   text:"La plupart des gens pensent que l'automatisation, c'est connecter des outils entre eux.\nPour un cabinet juridique ou une PME, c'est autre chose : comprendre le dossier, le courrier type, la contrainte métier — avant même de toucher à un seul outil.\nJe ne suis pas juriste qui a appris la technique. Je suis parti de la technique pour résoudre des problèmes que je connaissais déjà comme juriste."},

  {id:'s4-mer', week:'Semaine 4', day:'Mercredi', title:"Un petit comparatif utile", media:'opt',
   text:"Question qu'on me pose souvent : pourquoi n8n plutôt qu'un autre outil ?\nMa réponse courte : n8n quand le besoin est \"déclencheur → action\", sans mémoire complexe à gérer entre les étapes. Dès qu'il faut de la logique conditionnelle profonde ou un agent qui \"réfléchit\" sur plusieurs tours, d'autres outils prennent le relais.\nPour 90% des besoins d'un cabinet ou d'une PME, n8n suffit largement."},

  {id:'s4-ven', week:'Semaine 4', day:'Vendredi', title:"Bilan du mois", media:'none',
   text:"Un mois à documenter ce parcours ici, sans filtre.\nCe que je retiens : le plus dur n'est jamais l'outil. C'est de comprendre exactement ce qui fait perdre du temps à quelqu'un avant de proposer quoi que ce soit.\nLa suite : je continue à construire, un cas concret à la fois. Si tu es dans un cabinet, une PME, ou que tu automatises toi-même de ton côté — dis-moi ce que tu traites encore à la main."},
];

const MEDIA_LABEL = {req:'📷 Média requis', opt:'Média optionnel', none:'Sans média'};
const MEDIA_CLASS = {req:'media-req', opt:'media-opt', none:'media-none'};

let state = {};
let filter = 'all';

async function loadState(){
  try{
    const r = await window.storage.get('allsgood-threads-state', false);
    state = r ? JSON.parse(r.value) : {};
  }catch(e){ state = {}; }
  // seed pre-posted
  POSTS.forEach(p=>{ if(p.preposted && !(p.id in state)) state[p.id] = true; });
  render();
}

async function saveState(){
  try{ await window.storage.set('allsgood-threads-state', JSON.stringify(state), false); }
  catch(e){ console.error('storage error', e); }
}

function toggleDone(id){
  state[id] = !state[id];
  saveState();
  render();
}

async function copyText(id, btn){
  const post = POSTS.find(p=>p.id===id);
  try{
    await navigator.clipboard.writeText(post.text);
    btn.textContent = 'Copié ✓';
    btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent='Copier'; btn.classList.remove('copied'); }, 1600);
  }catch(e){
    btn.textContent = 'Erreur';
  }
}

function render(){
  const weeksEl = document.getElementById('weeks');
  weeksEl.innerHTML = '';
  const doneCount = POSTS.filter(p=>state[p.id]).length;
  document.getElementById('progress').innerHTML = `<span>${doneCount}</span> / ${POSTS.length} posts publiés`;

  const byWeek = {};
  POSTS.forEach(p=>{
    if(filter==='todo' && state[p.id]) return;
    if(filter==='done' && !state[p.id]) return;
    (byWeek[p.week] = byWeek[p.week]||[]).push(p);
  });

  const weekNames = [...new Set(POSTS.map(p=>p.week))];
  let anyVisible = false;

  weekNames.forEach(w=>{
    const items = byWeek[w];
    if(!items || !items.length) return;
    anyVisible = true;
    const sec = document.createElement('div');
    sec.className = 'week';
    sec.innerHTML = `<div class="week-label">${w}</div>`;
    items.forEach(p=>{
      const isDone = !!state[p.id];
      const card = document.createElement('div');
      card.className = 'card' + (isDone ? ' done' : '');
      card.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-day">${p.day}</div>
            <div class="card-title">${p.title}</div>
          </div>
          <div class="media-tag ${MEDIA_CLASS[p.media]}">${MEDIA_LABEL[p.media]}</div>
        </div>
        <div class="card-text">${p.text.replace(/</g,'&lt;')}</div>
        <div class="card-actions">
          <button class="btn copy">Copier</button>
          <button class="btn toggle ${isDone?'is-done':''}">${isDone ? 'Publié ✓' : 'Marquer publié'}</button>
        </div>
      `;
      card.querySelector('.btn.copy').addEventListener('click', (e)=>copyText(p.id, e.target));
      card.querySelector('.btn.toggle').addEventListener('click', ()=>toggleDone(p.id));
      sec.appendChild(card);
    });
    weeksEl.appendChild(sec);
  });

  document.getElementById('empty').style.display = anyVisible ? 'none' : 'block';
}

document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.f;
    render();
  });
});

loadState();
</script>
